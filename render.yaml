# Render Blueprint: explainer render worker only. The Next.js app stays on
# Vercel; the worker shares its Turso database and vault key.
# Deploy: Render dashboard → New → Blueprint → pick this repo.
services:
  - type: worker
    name: latewiz-render-worker
    runtime: docker
    dockerfilePath: ./Dockerfile.worker
    dockerContext: .
    # Headless Chrome needs ~1–2 GB per render; pick a plan with >= 2 GB RAM.
    plan: standard
    autoDeploy: true
    envVars:
      # Same values as the Vercel app.
      - key: TURSO_DATABASE_URL
        sync: false
      - key: TURSO_AUTH_TOKEN
        sync: false
      - key: VAULT_MASTER_KEY
        sync: false
      # Optional overrides (defaults are set in Dockerfile.worker).
      - key: OPENAI_IMAGE_MODEL
        value: gpt-image-2
      - key: RENDER_QUALITY
        value: looks
      - key: RENDER_WORKERS
        value: "1"
