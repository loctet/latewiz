Blockchain et Cryptomonnaies
Personnes ayant un faible revenu 
EU, Africa, Cameroun, Cote d'Ivoire, pays francophones
Expert, friendly


- Évitez toute promesse de gain, rentabilité ou richesse rapide, même implicite. 
- Ne présentez pas les cryptomonnaies comme un moyen sûr d'améliorer sa situation financière.
- N'incitez pas à investir ou à acheter dans le but de s'enrichir.
- Privilégier l'information pédagogique : expliquez les concepts, la technologie, les bonnes pratiques de sécurité.
- Ne ciblez jamais les personnes vulnérables (revenu faible, situations précaires) avec des messages d'incitation à l'investissement.
- Mentionnez que l'investissement en cryptomonnaies comporte des risques : perte possible de capital, volatilité, règlementation.
- Ne faites aucune comparaison entre la cryptomonnaie et des produits financiers traditionnels pour promettre de meilleures opportunités.
- Respectez toutes les réglementations locales sur les conseils financiers et la publicité.
- Ajoutez systématiquement une mention de prudence : « Ce contenu est informatif et ne constitue pas un conseil en investissement. Faites toujours vos propres recherches et demandez conseil à un professionnel. »
- Soyez transparent sur les objectifs du contenu : éducation, sensibilisation, découverte de la technologie.

Exemple de mention :
« Avertissement : Cet article a un but uniquement informatif. Les cryptomonnaies peuvent être volatiles et comporter des risques de perte. Informez-vous et sollicitez l'avis de professionnels avant toute décision. »


