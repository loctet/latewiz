<!doctype html>
<html
  lang="en"
  data-composition-variables='[
    {"id":"scenes","type":"string","label":"Scenes (JSON; empty = demo)","default":""},
    {"id":"totalDuration","type":"number","label":"Total seconds (worker)","default":0},
    {"id":"outroStart","type":"number","label":"Outro start (worker)","default":0},
    {"id":"captions","type":"boolean","label":"Captions","default":true},
    {"id":"brandName","type":"string","label":"Brand name","default":"Acme Studio"},
    {"id":"primaryColor","type":"color","label":"Primary","default":"#1E3A5F"},
    {"id":"accentColor","type":"color","label":"Accent","default":"#D97757"},
    {"id":"logo","type":"string","label":"Logo file","default":""},
    {"id":"signature","type":"string","label":"Signature","default":"— The Acme team"},
    {"id":"ctaText","type":"string","label":"Call to action","default":"Follow for more"},
    {"id":"handle","type":"string","label":"Handle","default":"@acmestudio"},
    {"id":"showOutro","type":"boolean","label":"Outro","default":true}
  ]'
>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <title>Whiteboard Explainer</title>
    <script src="gsap.min.js"></script>
    <style>
      @font-face { font-family: "AD"; src: url("fonts/ArchitectsDaughter-Regular.ttf") format("truetype"); }
      html, body { margin: 0; padding: 0; background: #d8d3ca; }
      #root { position: relative; width: 100%; height: 100%; overflow: hidden; background: #d8d3ca; font-family: "AD", sans-serif; }
      #board { position: absolute; left: 0; top: 0; width: 100%; height: 100%; }
    </style>
  </head>
  <body>
    <div id="root" data-composition-id="whiteboard" data-start="0" data-width="1080" data-height="1920">
      <canvas id="board" width="1080" height="1920"></canvas>
      <!-- narration-audio -->
    </div>
    <script type="module" src="main.js"></script>
  </body>
</html>
