  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <title>Branded Explainer</title>
    <script src="gsap.min.js"></script>
    <style>
      @font-face { font-family: "Inter"; src: url("fonts/inter-latin-400-normal.woff2") format("woff2"); font-weight: 400; }
      @font-face { font-family: "Inter"; src: url("fonts/inter-latin-700-normal.woff2") format("woff2"); font-weight: 700; }
      @font-face { font-family: "Poppins"; src: url("fonts/poppins-latin-400-normal.woff2") format("woff2"); font-weight: 400; }
      @font-face { font-family: "Poppins"; src: url("fonts/poppins-latin-700-normal.woff2") format("woff2"); font-weight: 700; }
      @font-face { font-family: "Montserrat"; src: url("fonts/montserrat-latin-400-normal.woff2") format("woff2"); font-weight: 400; }
      @font-face { font-family: "Montserrat"; src: url("fonts/montserrat-latin-700-normal.woff2") format("woff2"); font-weight: 700; }
      @font-face { font-family: "Space Grotesk"; src: url("fonts/space-grotesk-latin-400-normal.woff2") format("woff2"); font-weight: 400; }
      @font-face { font-family: "Space Grotesk"; src: url("fonts/space-grotesk-latin-700-normal.woff2") format("woff2"); font-weight: 700; }
      @font-face { font-family: "DM Sans"; src: url("fonts/dm-sans-latin-400-normal.woff2") format("woff2"); font-weight: 400; }
      @font-face { font-family: "DM Sans"; src: url("fonts/dm-sans-latin-700-normal.woff2") format("woff2"); font-weight: 700; }
      @font-face { font-family: "Playfair Display"; src: url("fonts/playfair-display-latin-400-normal.woff2") format("woff2"); font-weight: 400; }
      @font-face { font-family: "Playfair Display"; src: url("fonts/playfair-display-latin-700-normal.woff2") format("woff2"); font-weight: 700; }

      html, body { margin: 0; padding: 0; }
      body { background: #000; }

      #root {
        position: relative;
        width: 100%;
        height: 100%;
        overflow: hidden;
        --bg: var(--backgroundColor, #0F172A);
        --fg: var(--textColor, #F8FAFC);
        --muted: rgba(248, 250, 252, 0.75);
        --accent: var(--accentColor, #F2A541);
        --primary: var(--primaryColor, #1E3A5F);
        --secondary: var(--secondaryColor, #4A6FA5);
        --font: "Inter", sans-serif;
        --display-font: var(--font);
        background: var(--bg);
        color: var(--fg);
        font-family: var(--font);
      }

      /* ---------- Scene shell ---------- */
      .scene { position: absolute; inset: 0; overflow: hidden; opacity: 0; }
      .camera { position: absolute; inset: 0; }
      .scene-bg { position: absolute; inset: 0; background: var(--bg); }

      /* Media (illustration / b-roll). Full-bleed or card. */
      .media { position: absolute; overflow: hidden; background: var(--primary); }
      .layout-full .media { inset: 0; }
      .layout-card .media {
        left: 70px; right: 70px; top: 360px; height: 700px;
        border-radius: 48px;
        box-shadow: 0 40px 90px rgba(0, 0, 0, 0.45);
      }
      .media img {
        position: absolute; left: 0; top: 0; width: 100%; height: 100%;
        object-fit: cover;
      }
      /* Procedural art when there is no illustration. */
      .art { position: absolute; inset: 0; background: linear-gradient(160deg, var(--primary), var(--secondary)); }
      .art .shape { position: absolute; border-radius: 50%; }
      .art .s1 { width: 760px; height: 760px; left: -160px; top: 120px; background: radial-gradient(circle, var(--accent) 0%, transparent 62%); opacity: 0.55; }
      .art .s2 { width: 420px; height: 420px; right: -80px; top: 60px; border: 26px solid rgba(255,255,255,0.14); box-sizing: border-box; }
      .art .s3 { width: 240px; height: 240px; right: 160px; bottom: 260px; border-radius: 56px; background: rgba(255,255,255,0.10); }
      .art .s4 { width: 120px; height: 120px; left: 140px; bottom: 420px; background: var(--accent); opacity: 0.8; }
      .art .grid {
        position: absolute; inset: 0; opacity: 0.18;
        background-image: radial-gradient(rgba(255,255,255,0.9) 2px, transparent 2px);
        background-size: 54px 54px;
      }

      .scrim-top {
        position: absolute; left: 0; right: 0; top: 0; height: 720px;
        background: linear-gradient(180deg, var(--bg) 0%, color-mix(in srgb, var(--bg) 70%, transparent) 45%, transparent 100%);
      }
      .scrim-bottom {
        position: absolute; left: 0; right: 0; bottom: 0; height: 900px;
        background: linear-gradient(0deg, var(--bg) 0%, color-mix(in srgb, var(--bg) 82%, transparent) 40%, transparent 100%);
      }
      .layout-full.heavy .scrim-bottom { height: 1920px; }

      /* ---------- Headline ---------- */
      .headline {
        position: absolute; left: 80px; right: 80px; top: 190px;
        font-family: var(--display-font); font-weight: 700;
        line-height: 1.02; letter-spacing: -0.025em;
        text-shadow: 0 6px 30px rgba(0, 0, 0, 0.35);
      }
      .headline .w { display: inline-block; overflow: hidden; vertical-align: top; padding-bottom: 0.08em; margin-bottom: -0.08em; }
      .headline .wi { display: inline-block; }
      .headline .hl { color: var(--accent); }
      .underline {
        height: 14px; width: 220px; border-radius: 7px; margin-top: 26px;
        background: var(--accent); transform-origin: left center;
      }

      /* ---------- Steps (process flow) ---------- */
      .flow { position: absolute; left: 90px; right: 80px; top: 1120px; height: 400px; }
      .flow svg { position: absolute; left: 0; top: 0; overflow: visible; }
      .flow .node {
        position: absolute; left: 0; width: 76px; height: 76px; border-radius: 50%;
        background: var(--accent); color: var(--bg);
        display: flex; align-items: center; justify-content: center;
        font-weight: 700; font-size: 38px;
        box-shadow: 0 0 0 10px color-mix(in srgb, var(--accent) 25%, transparent);
      }
      .flow .label {
        position: absolute; left: 112px; right: 0; height: 76px;
        display: flex; align-items: center;
        font-size: 50px; font-weight: 700; line-height: 1.1;
      }

      /* ---------- Bullets (cards) ---------- */
      .cards { position: absolute; left: 80px; right: 80px; top: 1110px; display: flex; flex-direction: column; gap: 22px; }
      .card {
        display: flex; align-items: center; gap: 28px;
        padding: 22px 30px; border-radius: 28px;
        background: color-mix(in srgb, var(--fg) 10%, transparent);
        border: 2px solid color-mix(in srgb, var(--fg) 16%, transparent);
        font-size: 46px; font-weight: 700;
      }
      .card svg { flex: 0 0 auto; }

      /* ---------- Stat ---------- */
      .stat {
        position: absolute; left: 0; right: 0; top: 560px;
        display: flex; flex-direction: column; align-items: center; text-align: center;
      }
      .ring-wrap { position: relative; width: 640px; height: 640px; display: flex; align-items: center; justify-content: center; }
      .ring-wrap svg { position: absolute; left: 0; top: 0; }
      .stat-value {
        font-family: var(--display-font); font-weight: 700;
        font-size: 230px; line-height: 1; letter-spacing: -0.04em; color: var(--accent);
      }
      .stat-label { margin-top: 30px; padding: 0 110px; font-size: 54px; line-height: 1.2; font-weight: 700; }
      .spark { position: absolute; width: 22px; height: 22px; border-radius: 50%; background: var(--accent); left: 309px; top: 309px; }

      /* ---------- Compare ---------- */
      .compare { position: absolute; left: 70px; right: 70px; top: 1120px; height: 340px; }
      .side {
        position: absolute; top: 0; width: 430px; height: 300px; border-radius: 36px;
        display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center;
        font-size: 56px; font-weight: 700; padding: 0 30px; box-sizing: border-box;
      }
      .side small { display: block; font-size: 30px; font-weight: 400; opacity: 0.75; margin-bottom: 14px; letter-spacing: 0.12em; text-transform: uppercase; }
      .side.left { left: 0; background: color-mix(in srgb, var(--fg) 10%, transparent); color: var(--muted); }
      .side.right { right: 0; background: var(--accent); color: var(--bg); }
      .vs {
        position: absolute; left: 410px; top: 90px; width: 120px; height: 120px;
        border-radius: 50%; background: var(--bg); color: var(--fg);
        display: flex; align-items: center; justify-content: center;
        font-weight: 700; font-size: 40px; border: 6px solid var(--accent); box-sizing: border-box;
      }

      /* ---------- Quote ---------- */
      .quote { position: absolute; left: 90px; right: 90px; top: 520px; }
      .quote-mark { font-family: "Playfair Display", serif; font-size: 360px; line-height: 0.7; color: var(--accent); height: 220px; }
      .quote-text { font-family: var(--display-font); font-weight: 700; font-size: 84px; line-height: 1.12; }
      .quote-author { margin-top: 44px; font-size: 44px; color: var(--muted); }

      /* ---------- Captions ---------- */
      #captions { position: absolute; left: 70px; right: 70px; bottom: 300px; height: 240px; }
      .cap-group {
        position: absolute; left: 0; right: 0; bottom: 0;
        display: flex; flex-wrap: wrap; justify-content: center; gap: 6px 16px;
        opacity: 0;
      }
      .cap-word {
        display: inline-block; padding: 6px 16px; border-radius: 16px;
        font-weight: 700; font-size: 66px; line-height: 1.12;
        color: #FFFFFF;
        text-shadow: 0 4px 0 rgba(0,0,0,0.55), 0 0 26px rgba(0,0,0,0.55);
      }

      /* ---------- Chrome ---------- */
      #logo-bug { position: absolute; height: 78px; max-width: 280px; object-fit: contain; opacity: 0; }
      #logo-bug.top-left { left: 64px; top: 72px; }
      #logo-bug.top-right { right: 64px; top: 72px; }
      #logo-bug.bottom-left { left: 64px; bottom: 120px; }
      #logo-bug.bottom-right { right: 64px; bottom: 120px; }
      #progress-track { position: absolute; left: 64px; right: 64px; bottom: 56px; height: 8px; border-radius: 4px; background: rgba(255,255,255,0.18); overflow: hidden; }
      #progress-fill { width: 100%; height: 100%; background: var(--accent); transform-origin: left center; }
      #flash { position: absolute; inset: 0; background: #FFFFFF; opacity: 0; pointer-events: none; }

      /* ---------- Outro ---------- */
      #outro { position: absolute; inset: 0; opacity: 0; overflow: hidden; }
      #outro .bg { position: absolute; inset: 0; background: linear-gradient(160deg, var(--primary), var(--bg) 70%); }
      #outro .inner { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 0 90px; }
      #outro .ring { position: absolute; left: 260px; top: 400px; width: 560px; height: 560px; border-radius: 50%; border: 10px solid var(--accent); opacity: 0; box-sizing: border-box; }
      .outro-logo { max-width: 460px; max-height: 220px; object-fit: contain; margin-bottom: 70px; }
      .outro-name { font-family: var(--display-font); font-weight: 700; font-size: 96px; margin-bottom: 60px; }
      .outro-cta { font-family: var(--display-font); font-weight: 700; font-size: 100px; line-height: 1.05; letter-spacing: -0.02em; }
      .outro-handle { margin-top: 56px; padding: 24px 54px; border-radius: 999px; background: var(--accent); color: var(--bg); font-size: 52px; font-weight: 700; }
      .outro-sign { margin-top: 64px; font-size: 44px; color: var(--muted); }
      .outro-site { margin-top: 16px; font-size: 40px; color: var(--muted); }

      /* Themes */
      .theme-editorial .art { background: linear-gradient(160deg, #EDE6D8, #D9CDB8); }
      .theme-minimal .scrim-top, .theme-minimal .scrim-bottom { opacity: 0.9; }
    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="explainer"
      data-start="0"
      data-width="1080"
      data-height="1920"
    >
      <div id="scenes"></div>
      <div id="outro"></div>
      <div id="captions"></div>
      <img id="logo-bug" alt="" />
      <div id="progress-track"><div id="progress-fill"></div></div>
      <div id="flash"></div>
      <!-- narration-audio -->
    </div>

    <script>
      (function () {
        var v = window.__hyperframes.getVariables();
        var root = document.getElementById("root");
        var host = document.getElementById("scenes");

        // ---------------- Theme ----------------
        var theme = ["minimal", "bold", "gradient", "editorial"].indexOf(v.videoTheme) >= 0 ? v.videoTheme : "bold";
        root.classList.add("theme-" + theme);
        root.style.setProperty("--font", '"' + String(v.fontFamily || "Inter") + '", sans-serif');
        if (theme === "editorial") root.style.setProperty("--display-font", '"Playfair Display", serif');
        if (theme === "minimal" || theme === "editorial") {
          root.style.setProperty("--bg", theme === "minimal" ? "#FAFAF7" : "#F4EFE6");
          root.style.setProperty("--fg", "#141414");
          root.style.setProperty("--muted", "rgba(20, 20, 20, 0.65)");
        }

        // ---------------- Data ----------------
        function text(value, max) { return String(value == null ? "" : value).replace(/\s+/g, " ").trim().slice(0, max); }
        var scenes = [];
        try {
          var parsed = JSON.parse(v.scenes || "[]");
          if (Array.isArray(parsed)) scenes = parsed.slice(0, 8);
        } catch (e) { scenes = []; }
        if (!scenes.length) scenes = [{ type: "hook", heading: text(v.brandName, 60) || "Explainer", narration: text(v.brandName, 60) || "Explainer" }];

        // Timing: the worker passes start/duration/audioDuration. Without them
        // (Studio preview), lay out from word counts, same rules as the worker.
        var OVERLAP = 0.5, LEAD = 0.3, OUTRO = v.showOutro ? 3.6 : 0, MIN_TOTAL = 30;
        var timed = scenes.every(function (s) { return isFinite(Number(s.start)) && Number(s.duration) > 0; });
        if (!timed) {
          var base = scenes.map(function (s) {
            var words = text(s.narration, 400).split(" ").filter(Boolean).length;
            var audio = Number(s.audioDuration) > 0 ? Number(s.audioDuration) : words / 2.5;
            return { audio: audio, duration: Math.max(3.4, LEAD + audio + 0.45 + OVERLAP) };
          });
          var natural = base.reduce(function (sum, b) { return sum + b.duration - OVERLAP; }, 0) + OVERLAP + OUTRO;
          var stretch = Math.max(0, MIN_TOTAL - natural) / base.length;
          var t0 = 0;
          scenes.forEach(function (s, i) {
            s.start = t0;
            s.duration = base[i].duration + stretch;
            s.audioDuration = base[i].audio;
            t0 += s.duration - OVERLAP;
          });
        }
        scenes.forEach(function (s) { s.start = Number(s.start); s.duration = Number(s.duration); });
        var last = scenes[scenes.length - 1];
        var outroStart = Number(v.outroStart) > 0 ? Number(v.outroStart) : last.start + last.duration - OVERLAP;
        var total = Number(v.totalDuration) > 0 ? Number(v.totalDuration) : outroStart + (OUTRO || OVERLAP);

        var logo = text(v.logo, 300);

        // ---------------- DOM helpers ----------------
        function el(tag, cls, content) {
          var n = document.createElement(tag);
          if (cls) n.className = cls;
          if (content != null) n.textContent = content;
          return n;
        }
        var SVGNS = "http://www.w3.org/2000/svg";
        function svg(tag, attrs) {
          var n = document.createElementNS(SVGNS, tag);
          for (var k in attrs) n.setAttribute(k, attrs[k]);
          return n;
        }

        function buildMedia(scene) {
          var media = el("div", "media");
          // Ken Burns and drifting shapes move past the frame on purpose.
          media.setAttribute("data-layout-allow-overflow", "");
          if (scene.image) {
            var img = el("img", "kb");
            img.setAttribute("data-layout-allow-overflow", "");
            img.src = scene.image;
            img.alt = "";
            media.appendChild(img);
          } else {
            var art = el("div", "art kb");
            art.setAttribute("data-layout-allow-overflow", "");
            art.appendChild(el("div", "grid"));
            ["s1", "s2", "s3", "s4"].forEach(function (c) {
              var sh = el("div", "shape " + c);
              sh.setAttribute("data-layout-allow-overflow", "");
              art.appendChild(sh);
            });
            media.appendChild(art);
          }
          return media;
        }

        function buildHeadline(heading, size) {
          var box = el("div", "headline");
          box.style.fontSize = size + "px";
          var words = text(heading, 70).split(" ").filter(Boolean);
          // Highlight the longest word (usually the key noun or verb).
          var hi = 0;
          words.forEach(function (w, i) { if (w.length > words[hi].length) hi = i; });
          words.forEach(function (w, i) {
            var outer = el("span", "w");
            outer.setAttribute("data-layout-allow-overflow", "");
            outer.appendChild(el("span", "wi" + (i === hi ? " hl" : ""), w));
            box.appendChild(outer);
            if (i < words.length - 1) box.appendChild(document.createTextNode(" "));
          });
          box.appendChild(el("div", "underline"));
          return box;
        }

        function headlineSize(heading, layout) {
          var n = text(heading, 70).length;
          if (layout === "card") return n <= 22 ? 92 : n <= 36 ? 78 : 66;
          return n <= 18 ? 124 : n <= 30 ? 104 : 86;
        }

        // ---------------- Build scenes ----------------
        var built = scenes.map(function (s) {
          var type = String(s.type || "illustration");
          var layout = type === "steps" || type === "bullets" || type === "compare" ? "card" : "full";
          var node = el("section", "scene layout-" + layout + (type === "stat" || type === "quote" ? " heavy" : ""));
          var camera = el("div", "camera");
          node.appendChild(camera);
          camera.appendChild(el("div", "scene-bg"));
          var media = buildMedia(s);
          camera.appendChild(media);
          if (layout === "full") {
            camera.appendChild(el("div", "scrim-top"));
            camera.appendChild(el("div", "scrim-bottom"));
          }

          var parts = { node: node, camera: camera, media: media, type: type, layout: layout };

          if (type === "quote") {
            var q = el("div", "quote");
            q.appendChild(el("div", "quote-mark", "“"));
            var qt = el("div", "quote-text");
            text(s.heading, 120).split(" ").forEach(function (w, i, arr) {
              qt.appendChild(el("span", "qw", w));
              if (i < arr.length - 1) qt.appendChild(document.createTextNode(" "));
            });
            q.appendChild(qt);
            if (s.author) q.appendChild(el("div", "quote-author", "— " + text(s.author, 50)));
            camera.appendChild(q);
            parts.quote = q;
          } else {
            parts.headline = buildHeadline(s.heading, headlineSize(s.heading, layout));
            if (layout === "card") parts.headline.style.top = "150px";
            camera.appendChild(parts.headline);
          }

          if (type === "stat") {
            var stat = el("div", "stat");
            var ring = el("div", "ring-wrap");
            var R = 290, C = 2 * Math.PI * R;
            var ringSvg = svg("svg", { width: 640, height: 640, viewBox: "0 0 640 640" });
            ringSvg.appendChild(svg("circle", { cx: 320, cy: 320, r: R, fill: "none", stroke: "rgba(255,255,255,0.14)", "stroke-width": 22 }));
            var arc = svg("circle", { cx: 320, cy: 320, r: R, fill: "none", stroke: "var(--accent)", "stroke-width": 22, "stroke-linecap": "round", transform: "rotate(-90 320 320)", "stroke-dasharray": C, "stroke-dashoffset": C });
            ringSvg.appendChild(arc);
            ring.appendChild(ringSvg);
            var sparks = [];
            for (var k = 0; k < 10; k++) { var sp = el("div", "spark"); ring.appendChild(sp); sparks.push(sp); }
            var valueEl = el("div", "stat-value", text(s.value, 10));
            ring.appendChild(valueEl);
            stat.appendChild(ring);
            if (s.label) stat.appendChild(el("div", "stat-label", text(s.label, 80)));
            camera.appendChild(stat);
            var m = /^([^\d-]*)(-?[\d.,]+)(.*)$/.exec(text(s.value, 10));
            var pct = m && /%/.test(m[3]) ? Math.min(100, parseFloat(m[2].replace(/,/g, ""))) : 100;
            parts.stat = { root: stat, arc: arc, circumference: C, value: valueEl, match: m, pct: pct, sparks: sparks, label: stat.querySelector(".stat-label") };
          }

          if (type === "steps") {
            var flow = el("div", "flow");
            var items = (s.items || []).slice(0, 4);
            var gap = items.length > 3 ? 100 : 128;
            var line = svg("svg", { width: 76, height: 420 });
            var lineLen = Math.max(1, gap * (items.length - 1));
            var path = svg("line", { x1: 38, y1: 38, x2: 38, y2: 38 + lineLen, stroke: "var(--accent)", "stroke-width": 8, "stroke-linecap": "round", "stroke-dasharray": lineLen, "stroke-dashoffset": lineLen });
            line.appendChild(path);
            flow.appendChild(line);
            var nodes = items.map(function (item, i) {
              var nd = el("div", "node", String(i + 1));
              nd.style.top = i * gap + "px";
              var lb = el("div", "label", text(item, 40));
              lb.style.top = i * gap + "px";
              flow.appendChild(nd);
              flow.appendChild(lb);
              return { node: nd, label: lb };
            });
            camera.appendChild(flow);
            parts.steps = { path: path, len: lineLen, nodes: nodes };
          }

          if (type === "bullets") {
            var cards = el("div", "cards");
            parts.bullets = (s.items || []).slice(0, 4).map(function (item) {
              var c = el("div", "card");
              var check = svg("svg", { width: 56, height: 56, viewBox: "0 0 56 56" });
              check.appendChild(svg("circle", { cx: 28, cy: 28, r: 26, fill: "var(--accent)" }));
              var tick = svg("path", { d: "M16 29 L25 38 L41 19", fill: "none", stroke: "var(--bg)", "stroke-width": 6, "stroke-linecap": "round", "stroke-linejoin": "round", "stroke-dasharray": 40, "stroke-dashoffset": 40 });
              check.appendChild(tick);
              c.appendChild(check);
              c.appendChild(el("span", "", text(item, 40)));
              cards.appendChild(c);
              return { card: c, tick: tick };
            });
            camera.appendChild(cards);
          }

          if (type === "compare") {
            var cmp = el("div", "compare");
            var left = el("div", "side left");
            left.appendChild(el("small", "", "Before"));
            left.appendChild(document.createTextNode(text(s.left, 30)));
            var right = el("div", "side right");
            right.appendChild(el("small", "", "After"));
            right.appendChild(document.createTextNode(text(s.right, 30)));
            var vs = el("div", "vs", "VS");
            // Cards slide in from off-canvas; overlap before entry is intentional.
            [left, right, vs].forEach(function (n) { n.setAttribute("data-layout-allow-occlusion", ""); });
            cmp.appendChild(left); cmp.appendChild(right); cmp.appendChild(vs);
            camera.appendChild(cmp);
            parts.compare = { left: left, right: right, vs: vs };
          }

          host.appendChild(node);
          return parts;
        });

        // ---------------- Outro ----------------
        var outro = document.getElementById("outro");
        var outroParts = null;
        if (v.showOutro) {
          outro.appendChild(el("div", "bg"));
          var ringEl = el("div", "ring");
          outro.appendChild(ringEl);
          var inner = el("div", "inner");
          var mark = null;
          if (logo) { mark = el("img", "outro-logo"); mark.src = logo; mark.alt = ""; }
          else if (v.brandName) mark = el("div", "outro-name", text(v.brandName, 40));
          if (mark) inner.appendChild(mark);
          var cta = el("div", "outro-cta", text(v.ctaText, 60) || "Follow for more");
          inner.appendChild(cta);
          var handle = v.handle ? el("div", "outro-handle", text(v.handle, 60)) : null;
          if (handle) inner.appendChild(handle);
          var sign = v.signature ? el("div", "outro-sign", text(v.signature, 80)) : null;
          if (sign) inner.appendChild(sign);
          var site = v.website ? el("div", "outro-site", text(v.website, 120)) : null;
          if (site) inner.appendChild(site);
          outro.appendChild(inner);
          outroParts = { ring: ringEl, mark: mark, cta: cta, handle: handle, sign: sign, site: site };
        } else {
          outro.remove();
        }

        // ---------------- Captions ----------------
        var capHost = document.getElementById("captions");
        var capGroups = [];
        if (v.captions) {
          scenes.forEach(function (s) {
            var words = text(s.narration, 400).split(" ").filter(Boolean);
            if (!words.length) return;
            var audio = Number(s.audioDuration) > 0 ? Number(s.audioDuration) : words.length / 2.5;
            var t = s.start + LEAD;
            // Time each word by its length (longer words take longer to say).
            var weights = words.map(function (w) { return 1 + w.replace(/[^\w]/g, "").length * 0.18; });
            var sum = weights.reduce(function (a, b) { return a + b; }, 0);
            var times = [];
            words.forEach(function (w, i) { times.push(t); t += (weights[i] / sum) * audio; });
            // Groups of up to 3 words / 18 characters, breaking at sentence ends.
            var group = null, chars = 0;
            words.forEach(function (w, i) {
              if (!group || group.words.length >= 3 || chars + w.length > 18 || /[.!?]$/.test(words[i - 1] || "")) {
                group = { node: el("div", "cap-group"), words: [] };
                capHost.appendChild(group.node);
                capGroups.push(group);
                chars = 0;
              }
              var span = el("span", "cap-word", w);
              group.node.appendChild(span);
              group.words.push({ el: span, t: times[i], end: i + 1 < times.length ? times[i + 1] : s.start + LEAD + audio });
              chars += w.length + 1;
            });
          });
        } else {
          capHost.remove();
        }

        var bug = document.getElementById("logo-bug");
        if (logo && v.showIntro !== false) {
          bug.src = logo;
          bug.classList.add(["top-left", "top-right", "bottom-left", "bottom-right"].indexOf(v.logoPosition) >= 0 ? v.logoPosition : "top-right");
        } else {
          bug.remove();
        }

        // ---------------- Timeline ----------------
        function build() {
          var tl = gsap.timeline({ paused: true });
          var TRANSITIONS = ["zoom", "push", "circle", "whip"];

          built.forEach(function (p, i) {
            var s = scenes[i];
            var start = s.start, dur = s.duration;
            var narrStart = start + LEAD;
            var narrEnd = narrStart + Math.max(1, Number(s.audioDuration) || dur - 1);
            var node = p.node;
            var dir = i % 2 === 0 ? 1 : -1;

            // Entrance transition (the first scene is composed at t=0 for the thumbnail).
            if (i === 0) {
              tl.set(node, { opacity: 1 }, 0);
            } else {
              var kind = TRANSITIONS[(i - 1) % TRANSITIONS.length];
              var prev = built[i - 1].node;
              var T = OVERLAP;
              if (kind === "zoom") {
                tl.fromTo(prev, { scale: 1, filter: "blur(0px)" }, { scale: 1.35, filter: "blur(16px)", opacity: 0, duration: T, ease: "power2.in" }, start);
                tl.fromTo(node, { opacity: 0, scale: 0.82, filter: "blur(16px)" }, { opacity: 1, scale: 1, filter: "blur(0px)", duration: T + 0.15, ease: "power3.out" }, start + 0.05);
                tl.fromTo("#flash", { opacity: 0 }, { opacity: 0.28, duration: T * 0.5, yoyo: true, repeat: 1, ease: "sine.inOut" }, start);
              } else if (kind === "push") {
                tl.fromTo(prev, { yPercent: 0 }, { yPercent: -100, duration: T + 0.1, ease: "power3.inOut" }, start);
                tl.set(node, { opacity: 1 }, start);
                tl.fromTo(node, { yPercent: 100 }, { yPercent: 0, duration: T + 0.1, ease: "power3.inOut" }, start);
                tl.set(prev, { opacity: 0 }, start + T + 0.1);
              } else if (kind === "circle") {
                tl.set(node, { opacity: 1 }, start);
                tl.fromTo(node, { clipPath: "circle(0% at 50% 55%)" }, { clipPath: "circle(150% at 50% 55%)", duration: T + 0.25, ease: "power2.inOut" }, start);
                tl.fromTo(prev, { scale: 1 }, { scale: 0.9, duration: T + 0.25, ease: "power2.inOut" }, start);
                tl.set(prev, { opacity: 0 }, start + T + 0.25);
              } else {
                tl.fromTo(prev, { xPercent: 0, skewX: 0 }, { xPercent: -100, skewX: 8, duration: T, ease: "power4.in" }, start);
                tl.set(node, { opacity: 1 }, start + 0.05);
                tl.fromTo(node, { xPercent: 100, skewX: -8 }, { xPercent: 0, skewX: 0, duration: T + 0.1, ease: "power4.out" }, start + 0.05);
                tl.set(prev, { opacity: 0 }, start + T + 0.15);
                tl.fromTo("#flash", { opacity: 0 }, { opacity: 0.2, duration: 0.12, yoyo: true, repeat: 1 }, start + T * 0.6);
              }
            }

            // Camera: slow push over the scene + one punch-in zoom mid-way.
            tl.fromTo(p.camera, { scale: 1 }, { scale: 1.05, duration: dur, ease: "none" }, start);
            var punchAt = start + Math.max(1.4, dur * 0.55);
            tl.to(p.camera, { scale: "+=0.045", duration: 0.22, ease: "power2.out" }, punchAt);
            tl.to(p.camera, { scale: "-=0.045", duration: 0.7, ease: "power2.inOut" }, punchAt + 0.22);

            // Ken Burns on the illustration / art.
            var kb = p.media.querySelector(".kb");
            if (kb) {
              tl.fromTo(kb, { scale: 1.08, xPercent: -3 * dir, yPercent: 2 }, { scale: 1.26, xPercent: 3 * dir, yPercent: -3, duration: dur + 0.6, ease: "sine.inOut" }, Math.max(0, start - 0.1));
            }
            p.media.querySelectorAll(".shape").forEach(function (sh, k) {
              tl.fromTo(sh, { x: 0, y: 0, rotation: 0 }, { x: (k % 2 ? -1 : 1) * (60 + k * 20), y: (k % 2 ? 1 : -1) * (80 + k * 15), rotation: k * 40 * dir, duration: dur, ease: "sine.inOut" }, start);
            });
            if (p.layout === "card") {
              tl.fromTo(p.media, { y: 120, scale: 0.9, rotation: -3 * dir }, { y: 0, scale: 1, rotation: 0, duration: 0.9, ease: "back.out(1.4)" }, start + 0.1);
            }

            // Headline: masked word rise + underline sweep + key-word pulse.
            if (p.headline) {
              var wis = p.headline.querySelectorAll(".wi");
              if (i > 0) {
                tl.fromTo(wis, { yPercent: 110 }, { yPercent: 0, duration: 0.6, ease: "power4.out", stagger: 0.07 }, start + 0.2);
              }
              tl.fromTo(p.headline.querySelector(".underline"), { scaleX: 0 }, { scaleX: 1, duration: 0.6, ease: "power3.inOut" }, start + (i === 0 ? 0.3 : 0.6));
              tl.fromTo(p.headline.querySelector(".hl"), { scale: 1 }, { scale: 1.08, duration: 0.3, yoyo: true, repeat: 1, ease: "sine.inOut" }, start + 1.1);
            }

            // Spread content beats across the narration.
            function beat(k, n) { return narrStart + ((narrEnd - narrStart) * (k + 0.35)) / Math.max(1, n); }

            if (p.steps) {
              var n = p.steps.nodes.length;
              tl.fromTo(p.steps.path, { strokeDashoffset: p.steps.len }, { strokeDashoffset: 0, duration: Math.max(0.6, beat(n - 1, n) - beat(0, n)), ease: "none" }, beat(0, n));
              p.steps.nodes.forEach(function (it, k) {
                tl.fromTo(it.node, { scale: 0, rotation: -90 }, { scale: 1, rotation: 0, duration: 0.5, ease: "back.out(2.2)" }, beat(k, n) - 0.1);
                tl.fromTo(it.label, { opacity: 0, x: 60 }, { opacity: 1, x: 0, duration: 0.5, ease: "power3.out" }, beat(k, n));
              });
            }

            if (p.bullets) {
              var nb = p.bullets.length;
              p.bullets.forEach(function (b, k) {
                tl.fromTo(b.card, { opacity: 0, x: 140, rotation: 4 }, { opacity: 1, x: 0, rotation: 0, duration: 0.6, ease: "power3.out" }, beat(k, nb) - 0.15);
                tl.fromTo(b.tick, { strokeDashoffset: 40 }, { strokeDashoffset: 0, duration: 0.35, ease: "power2.out" }, beat(k, nb) + 0.2);
              });
            }

            if (p.stat) {
              var st = p.stat;
              var countAt = start + 0.5;
              tl.fromTo(st.root, { scale: 0.7, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.7, ease: "back.out(1.6)" }, start + 0.15);
              tl.fromTo(st.arc, { strokeDashoffset: st.circumference }, { strokeDashoffset: st.circumference * (1 - st.pct / 100), duration: 1.6, ease: "power2.out" }, countAt);
              if (st.match) {
                var prefix = st.match[1], suffix = st.match[3];
                var target = parseFloat(st.match[2].replace(/,/g, ""));
                var decimals = (st.match[2].split(".")[1] || "").length;
                var proxy = { n: 0 };
                tl.fromTo(proxy, { n: 0 }, {
                  n: target, duration: 1.6, ease: "power2.out",
                  onUpdate: function () { st.value.textContent = prefix + proxy.n.toFixed(decimals) + suffix; }
                }, countAt);
              }
              st.sparks.forEach(function (sp, k) {
                var a = (k / st.sparks.length) * Math.PI * 2;
                tl.fromTo(sp, { x: 0, y: 0, scale: 1, opacity: 0 }, { x: Math.cos(a) * 380, y: Math.sin(a) * 380, scale: 0.2, opacity: 1, duration: 0.8, ease: "power3.out" }, countAt + 1.5);
                tl.to(sp, { opacity: 0, duration: 0.3 }, countAt + 2.0);
              });
              tl.fromTo(st.value, { scale: 1 }, { scale: 1.12, duration: 0.18, yoyo: true, repeat: 1, ease: "power2.out" }, countAt + 1.55);
              if (st.label) tl.fromTo(st.label, { opacity: 0, y: 40 }, { opacity: 1, y: 0, duration: 0.6, ease: "power3.out" }, countAt + 0.9);
            }

            if (p.compare) {
              var c = p.compare;
              tl.fromTo(c.left, { x: -520, rotation: -6 }, { x: 0, rotation: 0, duration: 0.7, ease: "power3.out" }, beat(0, 3));
              tl.fromTo(c.vs, { scale: 0, rotation: -180 }, { scale: 1, rotation: 0, duration: 0.55, ease: "back.out(2)" }, beat(0, 3) + 0.45);
              tl.fromTo(c.right, { x: 520, rotation: 6 }, { x: 0, rotation: 0, duration: 0.7, ease: "power3.out" }, beat(1, 3));
              tl.to(c.left, { opacity: 0.55, scale: 0.95, duration: 0.5 }, beat(2, 3));
              tl.fromTo(c.right, { scale: 1 }, { scale: 1.06, duration: 0.25, yoyo: true, repeat: 1, ease: "power2.out" }, beat(2, 3));
            }

            if (p.quote) {
              tl.fromTo(p.quote.querySelector(".quote-mark"), { scale: 0.3, opacity: 0, rotation: -20 }, { scale: 1, opacity: 1, rotation: 0, duration: 0.7, ease: "back.out(1.8)" }, start + 0.15);
              var qws = p.quote.querySelectorAll(".qw");
              tl.fromTo(qws, { opacity: 0.15 }, { opacity: 1, duration: 0.25, stagger: (narrEnd - narrStart) / Math.max(1, qws.length) }, narrStart);
              var qa = p.quote.querySelector(".quote-author");
              if (qa) tl.fromTo(qa, { opacity: 0, x: -40 }, { opacity: 1, x: 0, duration: 0.5 }, narrEnd - 0.4);
            }
          });

          // Outro: logo sting + ring burst + CTA.
          if (outroParts) {
            var o = outroParts, os = outroStart;
            tl.fromTo(outro, { opacity: 0, scale: 1.15 }, { opacity: 1, scale: 1, duration: 0.6, ease: "power3.out" }, os);
            tl.to(built[built.length - 1].node, { opacity: 0, duration: 0.6, ease: "power2.in" }, os);
            tl.fromTo(o.ring, { scale: 0.2, opacity: 1 }, { scale: 2.4, opacity: 0, duration: 1.2, ease: "power2.out" }, os + 0.35);
            if (o.mark) tl.fromTo(o.mark, { scale: 0.4, opacity: 0, rotation: -8 }, { scale: 1, opacity: 1, rotation: 0, duration: 0.8, ease: "back.out(1.7)" }, os + 0.3);
            tl.fromTo(o.cta, { y: 70, opacity: 0 }, { y: 0, opacity: 1, duration: 0.6, ease: "power4.out" }, os + 0.7);
            if (o.handle) {
              tl.fromTo(o.handle, { scale: 0.6, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.5, ease: "back.out(2)" }, os + 1.0);
              tl.to(o.handle, { scale: 1.06, duration: 0.35, yoyo: true, repeat: 3, ease: "sine.inOut" }, os + 1.8);
            }
            if (o.sign) tl.fromTo(o.sign, { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 0.5 }, os + 1.3);
            if (o.site) tl.fromTo(o.site, { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 0.5 }, os + 1.45);
          }

          // Captions: group pops in, the spoken word gets the accent pill.
          var accent = v.accentColor || "#F2A541";
          capGroups.forEach(function (g, gi) {
            var first = g.words[0].t, lastW = g.words[g.words.length - 1];
            var next = capGroups[gi + 1];
            // Hide before the next group shows, so two groups never overlap.
            var hideAt = Math.max(first + 0.25, Math.min(lastW.end + 0.25, next ? next.words[0].t - 0.06 : lastW.end + 0.25));
            tl.fromTo(g.node, { opacity: 0, y: 30, scale: 0.92 }, { opacity: 1, y: 0, scale: 1, duration: 0.14, ease: "back.out(2)" }, first);
            tl.to(g.node, { opacity: 0, duration: 0.05 }, hideAt);
            g.words.forEach(function (w) {
              tl.fromTo(w.el, { backgroundColor: "rgba(0,0,0,0)", color: "#FFFFFF", scale: 1 }, { backgroundColor: accent, color: "#111111", scale: 1.08, duration: 0.08 }, w.t);
              tl.to(w.el, { backgroundColor: "rgba(0,0,0,0)", color: "#FFFFFF", scale: 1, duration: 0.08 }, Math.max(w.t + 0.1, w.end - 0.02));
            });
          });

          // Logo bug: pops in early, hides for the outro.
          if (bug.isConnected) {
            tl.fromTo(bug, { opacity: 0, scale: 0.4 }, { opacity: 0.95, scale: 1, duration: 0.5, ease: "back.out(2)" }, 0.4);
            if (outroParts) tl.to(bug, { opacity: 0, duration: 0.3 }, outroStart);
          }

          tl.fromTo("#progress-fill", { scaleX: 0 }, { scaleX: 1, duration: total, ease: "none" }, 0);

          window.__timelines["explainer"] = tl;
        }

        if (document.fonts && document.fonts.ready) document.fonts.ready.then(build);
        else build();
      })();
    </script>
  </body>
</html>
