<!doctype html>
<html
  lang="en"
  data-composition-variables='[
    {"id":"scenes","type":"string","label":"Scenes (JSON; empty = demo)","default":""},
    {"id":"totalDuration","type":"number","label":"Total seconds (worker)","default":0},
    {"id":"outroStart","type":"number","label":"Outro start (worker)","default":0},
    {"id":"captions","type":"boolean","label":"Captions","default":true},
    {"id":"brandName","type":"string","label":"Brand name","default":"Acme Studio"},
    {"id":"primaryColor","type":"color","label":"Primary","default":"#1E3A5F"},
    {"id":"secondaryColor","type":"color","label":"Secondary","default":"#4A6FA5"},
    {"id":"accentColor","type":"color","label":"Accent","default":"#F2A541"},
    {"id":"backgroundColor","type":"color","label":"Background","default":"#0F172A"},
    {"id":"textColor","type":"color","label":"Text","default":"#F8FAFC"},
    {"id":"fontFamily","type":"enum","label":"Font","default":"Inter","options":[{"value":"Inter","label":"Inter"},{"value":"Poppins","label":"Poppins"},{"value":"Montserrat","label":"Montserrat"},{"value":"Space Grotesk","label":"Space Grotesk"},{"value":"DM Sans","label":"DM Sans"},{"value":"Playfair Display","label":"Playfair Display"}]},
    {"id":"videoTheme","type":"enum","label":"Theme","default":"bold","options":[{"value":"minimal","label":"Minimal"},{"value":"bold","label":"Bold"},{"value":"gradient","label":"Gradient"},{"value":"editorial","label":"Editorial"}]},
    {"id":"logoPosition","type":"enum","label":"Logo position","default":"top-right","options":[{"value":"top-left","label":"Top left"},{"value":"top-right","label":"Top right"},{"value":"bottom-left","label":"Bottom left"},{"value":"bottom-right","label":"Bottom right"}]},
    {"id":"logo","type":"string","label":"Logo file","default":""},
    {"id":"signature","type":"string","label":"Signature","default":"— The Acme team"},
    {"id":"ctaText","type":"string","label":"Call to action","default":"Follow for more"},
    {"id":"website","type":"string","label":"Website","default":"acme.studio"},
    {"id":"handle","type":"string","label":"Handle","default":"@acmestudio"},
    {"id":"showIntro","type":"boolean","label":"Logo intro","default":true},
    {"id":"showOutro","type":"boolean","label":"Signature outro","default":true}
  ]'
>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <title>Branded Explainer</title>
    <script src="gsap.min.js"></script>
    <script src="icons.js"></script>
    <script src="visuals.js"></script>
    <link rel="stylesheet" href="explainer.css" />
  </head>
  <body>
    <div
      id="root"
      data-composition-id="explainer"
      data-start="0"
      data-width="1080"
      data-height="1920"
    >
      <div id="bg">
        <div id="glow-a" data-layout-allow-overflow></div>
        <div id="glow-b" data-layout-allow-overflow></div>
        <div id="dots"></div>
        <div id="particles"></div>
      </div>
      <div id="scenes"></div>
      <div id="outro"></div>
      <div id="captions"></div>
      <img id="logo-bug" alt="" />
      <div id="progress-track"><div id="progress-fill"></div></div>
      <div id="flash"></div>
      <!-- narration-audio -->
    </div>
    <script src="explainer.js"></script>
  </body>
</html>
